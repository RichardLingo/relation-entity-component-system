[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relation-entity-component-system-kit"
version = "0.2.0"
description = "RECS — 关系-实体-组件系统：支持多后端（NumPy/PyTorch/MLX/JAX/TensorFlow）的高性能 ECS 引擎"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
mlx = ["mlx>=0.10"]
jax = ["jax>=0.4", "jaxlib>=0.4"]
tf = ["tensorflow>=2.12"]
all = ["recs[torch,mlx,jax,tf]"]
dev = ["pytest>=8.0"]

[project.urls]
Source = "https://github.com/RichardLingo/entity-relation-system-kit"
Issues = "https://github.com/RichardLingo/entity-relation-system-kit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecs*", "recs*"]

[tool.pytest.ini_options]
# 仅收集 test_*.py；保留旧 smoke_test.py / comprehensive_test.py 为可独立运行的遗留脚本（含 import 期副作用，不入 pytest 收集）
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
